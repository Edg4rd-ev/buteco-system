<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16130F" />
    <title>Comandas — Buteco Seu Barba</title>

    <!-- marca: sempre o logo completo, com o nome (public/marca/logo-seu-barba*) -->
    <link rel="icon" type="image/svg+xml" href="/marca/logo-seu-barba.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/marca/logo-seu-barba-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/marca/logo-seu-barba-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seu Barba" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Abertura: fica aqui, e não no estilos.css, porque precisa aparecer
         antes de o JS carregar. O React reusa as mesmas classes (Abertura.tsx)
         enquanto busca o perfil, então a troca não pisca. -->
    <style>
      html,body{margin:0;background:#16130F}
      .abertura{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:28px;background:#16130F}
      .abertura img{width:min(168px,44vw);height:auto}
      .abertura-giro{width:22px;height:22px;border-radius:50%;border:2.5px solid #F0B429;
        border-top-color:transparent;animation:abertura-girar .7s linear infinite;opacity:.85}
      @keyframes abertura-girar{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.abertura-giro{animation-duration:2s}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="abertura" role="status" aria-label="Carregando">
        <img src="/marca/logo-seu-barba.svg" alt="Buteco Seu Barba" width="168" height="168" />
        <span class="abertura-giro"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
